name: taxhance-pii-redaction

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    environment: &application-environment
      PII_RUNTIME: local
      PII_DATA_DIR: /data
      PII_PUBLIC_BASE_URL: http://localhost:8080
      PII_ALLOWED_ORIGINS: http://localhost:8080
      PII_TOKEN_PEPPER: ${PII_TOKEN_PEPPER:?Set PII_TOKEN_PEPPER in .env}
      PII_MODEL_BACKEND: ${PII_MODEL_BACKEND:-transformers}
      PII_MODEL_ID: ${PII_MODEL_ID:-Qwen/Qwen3.8-27B}
      PII_MODEL_REVISION: ${PII_MODEL_REVISION:-1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0}
      PII_MODEL_DTYPE: ${PII_MODEL_DTYPE:-4bit}
      PII_LLAMA_MODEL_FILE: ${PII_LLAMA_MODEL_FILE:-gemma-4-E2B-it-UD-Q4_K_XL.gguf}
      PII_LLAMA_MMPROJ_FILE: ${PII_LLAMA_MMPROJ_FILE:-mmproj-F16.gguf}
      PII_RETENTION_HOURS: 1
      PII_RETENTION_CLEANUP_MARGIN_MINUTES: 5
      PII_MODEL_AUDIT_PASSES: 1
    volumes:
      - pii-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    restart: unless-stopped
    environment:
      <<: *application-environment
      HF_HOME: /models/huggingface
      TRANSFORMERS_CACHE: /models/huggingface
    volumes:
      - pii-data:/data
      - model-cache:/models
    depends_on:
      api:
        condition: service_healthy
    gpus: all
    shm_size: 2gb
    read_only: true
    tmpfs:
      - /tmp:size=4g,mode=1777
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/cache/nginx:size=32m,mode=0755
      - /var/run:size=4m,mode=0755
    security_opt:
      - no-new-privileges:true

volumes:
  pii-data:
  model-cache:
