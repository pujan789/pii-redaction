name: taxhance-pii-redaction

# Every PII_* key in .env reaches the containers (limits, vLLM tuning, OCR).
# The values below are the ones Compose must own regardless of .env; set
# PII_PUBLIC_BASE_URL and PII_ALLOWED_ORIGINS in .env to the URL your staff
# will open (for example http://redaction.office.local:8080), otherwise
# uploads only work from a browser on this host.
x-application-environment: &application-environment
  PII_RUNTIME: local
  PII_DATA_DIR: /data
  PII_PUBLIC_BASE_URL: ${PII_PUBLIC_BASE_URL:-http://localhost:8080}
  PII_ALLOWED_ORIGINS: ${PII_ALLOWED_ORIGINS:-http://localhost:8080}
  PII_TOKEN_PEPPER: ${PII_TOKEN_PEPPER:?Set PII_TOKEN_PEPPER in .env}
  PII_MODEL_ID: ${PII_MODEL_ID:-google/gemma-4-E2B-it}
  PII_MODEL_REVISION: ${PII_MODEL_REVISION:-3e22461f65e89153144f8adb70e3b8c2cc9845a7}
  PII_RETENTION_HOURS: 1
  PII_RETENTION_CLEANUP_MARGIN_MINUTES: 5

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment: *application-environment
    volumes:
      - pii-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      <<: *application-environment
      # The root filesystem is read-only; every cache the model stack writes
      # lives on the model volume (mirrors the AWS task definition).
      HF_HOME: /models/huggingface
      HOME: /models/home
      XDG_CACHE_HOME: /models/cache
      TORCH_HOME: /models/torch
      TORCHINDUCTOR_CACHE_DIR: /models/torchinductor
      TRITON_CACHE_DIR: /models/triton
      CUDA_CACHE_PATH: /models/cuda
      TMPDIR: /tmp
    volumes:
      - pii-data:/data
      - model-cache:/models
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # The worker exits when vLLM dies; this catches a vLLM that is up but
      # not answering so Compose restarts the pair.
      test: ["CMD-SHELL", "python3 -c \"import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('PII_VLLM_PORT', '8000') + '/health', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 900s
    gpus: all
    shm_size: 2gb
    read_only: true
    tmpfs:
      - /tmp:size=4g,mode=1777
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/cache/nginx:size=32m,mode=0755
      - /var/run:size=4m,mode=0755
    security_opt:
      - no-new-privileges:true

volumes:
  pii-data:
  model-cache:
